<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SnapPix</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css" />
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-solid-rounded/css/uicons-solid-rounded.css" />
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-bold-rounded/css/uicons-bold-rounded.css" />
  <link rel="preconnect" href="https://i.ibb.co" crossorigin />
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
  <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
  <link rel="dns-prefetch" href="//i.ibb.co" />
  <link rel="dns-prefetch" href="//raw.githubusercontent.com" />
  <link rel="dns-prefetch" href="//firebasestorage.googleapis.com" />
  <link rel="preload" href="https://raw.githubusercontent.com/SterlingPlus-Studio/clyraplay.xyz/main/Fuente/fuente.ttf" as="font" type="font/ttf" crossorigin />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top-bar" id="topBar">
    <div class="app-title">
      <img class="app-title-icon" src="https://i.ibb.co/W4y02B2T/imagen.png" alt="SnapPix logo" />
      <span>SnapPix</span>
    </div>
    <div class="right-icons">
      <button class="icon-btn" id="searchBtn">
        <i class="fi fi-rr-search"></i>
      </button>
    </div>
  </header>

  <div class="feed-mode-switcher hidden" id="feedModeSwitcher" aria-label="Orden del feed">
    <button class="feed-mode-option" type="button" data-mode="recent">
      <span class="feed-mode-badge" id="recentPostsBadge">0</span>
      <span class="feed-mode-label">Recientes</span>
    </button>
    <span class="feed-mode-separator">/</span>
    <button class="feed-mode-option" type="button" data-mode="following">
      <span class="feed-mode-label">Siguiendo</span>
    </button>
    <span class="feed-mode-separator">/</span>
    <button class="feed-mode-option" type="button" data-mode="for-you">
      <span class="feed-mode-label">Para ti</span>
    </button>
  </div>

  <main class="main-content" id="mainContent"></main>

  <!-- Barra inferior -->
  <footer class="bottom-bar">
    <button class="nav-item active" id="homeBtn">
      <i class="fi fi-sr-house-blank"></i>
      <span>Inicio</span>
    </button>
    <button class="nav-item" id="shopBtn">
      <i class="fas fa-store"></i>
      <span>Tienda</span>
    </button>
    <button class="nav-item plus-btn" id="plusBtn">
      <i class="fas fa-plus"></i>
      <span>Nuevo</span>
    </button>
    <button class="nav-item" id="messagesBtn">
      <i class="fas fa-envelope"></i>
      <span>Mensajes</span>
      <span class="badge" id="notifBadge" style="display:none;">0</span>
    </button>
    <button class="nav-item" id="profileBtn">
      <i class="fi fi-rr-user"></i>
      <span>Perfil</span>
    </button>
  </footer>

  <audio id="globalAudio" preload="auto" playsinline style="display:none;"></audio>

  <!-- Comentarios -->
  <div class="comments-overlay" id="commentsOverlay">
    <div class="comments-panel">
      <div class="panel-header">
        <h3><i class="fas fa-comment"></i> Comentarios</h3>
        <button class="close-btn" id="closeCommentsBtn"><i class="fas fa-times"></i></button>
      </div>
      <div class="comments-list" id="commentsList">
        <div class="no-comments">No hay comentarios aún. ¡Sé el primero!</div>
      </div>
      <div class="comments-input-area">
        <input type="text" id="commentInput" placeholder="Escribe un comentario..." />
        <button class="send-btn" id="sendCommentBtn"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-overlay" id="chatOverlay">
    <div class="chat-panel">
      <div class="chat-header">
        <button class="back-btn" id="chatBackBtn"><i class="fas fa-arrow-left"></i></button>
        <div class="chat-user-info">
          <div class="avatar" id="chatAvatar"><span>?</span></div>
          <span class="name" id="chatUserName">Usuario</span>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty">Sin mensajes aún</div>
      </div>
      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Escribe un mensaje..." />
        <button id="chatSendBtn"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <!-- Selector de música -->
  <div class="music-picker-overlay" id="musicPickerOverlay">
    <div class="music-picker-panel">
      <div class="panel-header">
        <h3><i class="fas fa-music"></i> Seleccionar música</h3>
        <button class="close-btn" id="closeMusicPickerBtn"><i class="fas fa-times"></i></button>
      </div>
      <input type="text" class="music-search-input" id="musicSearchInput" placeholder="Buscar música..." />
      <div class="music-picker-list" id="musicPickerList"></div>
    </div>
  </div>

  <!-- Diálogo de descarga -->
  <div class="download-overlay" id="downloadOverlay">
    <div class="download-panel">
      <h3>
        <span class="download-title-main">Seleccionadas</span>
        <span class="download-selected-count" id="downloadSelectedCount">0/0</span>
      </h3>
      <div class="image-scroll" id="downloadImageScroll"></div>
      <div class="actions">
        <button class="btn-cancel" id="downloadCancelBtn">Cancelar</button>
        <button class="btn-download" id="downloadConfirmBtn">Descargar seleccionadas</button>
      </div>
    </div>
  </div>

  <!-- Confirmación eliminar -->
  <div class="delete-confirm-overlay" id="deleteConfirmOverlay">
    <div class="delete-confirm-panel">
      <div class="icon"><i class="fas fa-exclamation-triangle"></i></div>
      <div class="message">Esta acción no se podrá deshacer</div>
      <div class="actions">
        <button class="btn-cancel" id="deleteConfirmCancel">Cancelar</button>
        <button class="btn-danger" id="deleteConfirmAccept">Aceptar</button>
      </div>
    </div>
  </div>

  <!-- Confirmación de compra -->
  <div class="buy-confirm-overlay" id="buyConfirmOverlay">
    <div class="buy-confirm-panel">
      <div class="icon"><i class="fas fa-shopping-cart"></i></div>
      <div class="message">¿Quieres confirmar esta compra?</div>
      <div class="actions">
        <button class="btn-cancel" id="buyConfirmCancel">No</button>
        <button class="btn-confirm" id="buyConfirmAccept">Sí</button>
      </div>
    </div>
  </div>

  <!-- Modal subir item a tienda -->
  <div class="upload-item-overlay" id="uploadItemOverlay">
    <div class="upload-item-panel">
      <h3><i class="fas fa-upload"></i> Subir tu item</h3>
      <div class="form-group">
        <label>Imagen</label>
        <div class="image-preview" id="uploadImagePreview">
          <i class="fas fa-image"></i>
        </div>
        <input type="file" id="uploadImageInput" accept="image/png,image/jpeg,image/jpg,image/webp,image/svg+xml" style="display:none;" />
      </div>
      <div class="form-group">
        <label>Categoría</label>
        <div class="upload-category-options" role="radiogroup" aria-label="Categoría">
          <button class="upload-category-option selected" type="button" data-upload-category="profileFrames" aria-checked="true">
            <span class="upload-category-dot" aria-hidden="true"></span>
            <span class="upload-category-text">Foto de perfil</span>
          </button>
          <button class="upload-category-option" type="button" data-upload-category="particles" aria-checked="false">
            <span class="upload-category-dot" aria-hidden="true"></span>
            <span class="upload-category-text">✨ Partículas</span>
          </button>
          <button class="upload-category-option" type="button" data-upload-category="verifiedStickers" aria-checked="false">
            <span class="upload-category-dot" aria-hidden="true"></span>
            <span class="upload-category-text">Iconos verificado</span>
          </button>
        </div>
        <select id="uploadItemCategory" class="upload-category-select-hidden" aria-hidden="true" tabindex="-1">
          <option value="profileFrames">Foto de perfil</option>
          <option value="particles">✨ Partículas</option>
          <option value="verifiedStickers">Iconos verificado</option>
        </select>
      </div>
      <div class="form-group">
        <label>Precio (monedas)</label>
        <input type="number" id="uploadItemPrice" min="1" max="100" step="1" value="50" />
      </div>
      <div class="actions">
        <button class="btn-cancel" id="uploadCancelBtn">Cancelar</button>
        <button class="btn-submit" id="uploadSubmitBtn">Subir</button>
      </div>
    </div>
  </div>

  <!-- Burbuja de monedas -->
  <div class="coin-bubble" id="coinBubble">
    <i class="fas fa-coins coin-icon" aria-hidden="true"></i>
    <span id="coinBubbleText">+0</span>
  </div>

  <!-- Pantalla de bienvenida -->
  <div id="startOverlay" style="
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    color: white;
    cursor: pointer;
    text-align: center;
    font-family: sans-serif;
  ">
    <div class="start-overlay-spinner" aria-hidden="true"></div>
    <h2>🎵 Bienvenido a SnapPix</h2>
    <p style="opacity: 0.8;">Toca para iniciar</p>
  </div>

<script src="app.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var select = document.getElementById('uploadItemCategory');
  var options = document.querySelectorAll('.upload-category-option');
  if (!select || !options.length) return;

  var syncing = false;

  function syncCategory(value, fireChange) {
    syncing = true;
    select.value = value;
    options.forEach(function (btn) {
      var active = btn.getAttribute('data-upload-category') === value;
      btn.classList.toggle('selected', active);
      btn.setAttribute('aria-checked', active ? 'true' : 'false');
    });
    syncing = false;
    if (fireChange) {
      select.dispatchEvent(new Event('change', { bubbles: true }));
    }
  }

  options.forEach(function (btn) {
    btn.addEventListener('click', function () {
      syncCategory(btn.getAttribute('data-upload-category'), true);
    });
  });

  select.addEventListener('change', function () {
    if (!syncing) {
      syncCategory(this.value, false);
    }
  });

  syncCategory(select.value || 'profileFrames', false);
});
</script>
</body>
</html>
