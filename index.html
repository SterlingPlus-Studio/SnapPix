<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapPix | En Mantenimiento</title>
    <style>
        /* Importar la fuente personalizada desde el Raw de GitHub */
        @font-face {
            font-family: 'FuenteCustom';
            src: url('https://raw.githubusercontent.com/SterlingPlus-Studio/clyraplay.xyz/main/Fuente/fuente.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* Fondo con degradado azul oscuro y centrado directo */
        body {
            margin: 0;
            padding: 0;
            font-family: 'FuenteCustom', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #05101a 0%, #0d2b4d 50%, #164070 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            text-align: center;
            overflow: hidden;
        }

        /* Contenedor invisible solo para agrupar el texto */
        .content {
            padding: 20px;
            max-width: 600px;
        }

        /* Contenedor flexible para el icono y el logo */
        .header-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 5px;
        }

        /* Icono SVG animado */
        .icon {
            width: 60px;
            height: 60px;
            fill: #00f2fe;
            animation: spin 3s linear infinite;
            flex-shrink: 0;
        }

        /* Logotipo de SnapPix con colores neón */
        .logo {
            font-size: 58px;
            font-weight: normal;
            background: -webkit-linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        /* Título principal */
        h1 {
            font-size: 34px;
            margin: 15px 0;
            color: #ffffff;
            font-weight: normal;
        }

        /* Texto de descripción */
        p {
            font-size: 20px;
            line-height: 1.6;
            color: #a0b8d0;
            margin-bottom: 40px;
        }

        /* Fotogramas clave para la animación de giro */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="content">
        <!-- Icono y logo juntos en un contenedor flex -->
        <div class="header-logo">
            <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.99,0-3.6-1.61-3.6-3.6 s1.61-3.6,3.6-3.6s3.6,1.61,3.6,3.6S13.99,15.6,12,15.6z"/>
            </svg>
            <div class="logo">SnapPix</div>
        </div>

        <h1>Sitio en mantenimiento</h1>
        <p>Estamos trabajando bajo el capó para traerte nuevas funciones y una experiencia mucho más rápida. Volveremos a estar en línea muy pronto.</p>
    </div>

</body>
</html>
